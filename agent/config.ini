[server]
; URL of your PHP backend (no trailing slash)
url = http://YOUR_SERVER_IP_OR_HOSTNAME

; API key from the admin panel (Workstations → API Keys)
api_key = CHANGE_ME_TO_YOUR_API_KEY

[reader]
; Full path to the pcProx DLL
; Use pcProxAPI64.dll for 64-bit Windows, pcProxAPI.dll for 32-bit
dll_path = C:\Program Files\OneSign Agent\pcProxAPI64.dll

; How often to check for a card (milliseconds)
poll_interval_ms = 250

; Reader index to use when multiple RF IDeas readers are attached (-1 = auto/default)
active_device_index = -1

[behavior]
; Deprecated legacy remove-based lock option (tap-in/tap-out is preferred)
lock_on_remove = true

; Deprecated legacy delay option used with remove-based lock behavior
lock_delay_seconds = 5

; How often to send a heartbeat to the server (seconds)
heartbeat_interval = 30

; How long to wait before retrying a disconnected reader (seconds)
reconnect_delay_s = 10

[ui]
; Enable the agent-managed fullscreen lock overlay
fullscreen_shell_enabled = true

; Optional defaults (server settings override these when provided)
lock_background_image =
lock_logo_image =
lock_brand_name = Secure log in
lock_color_primary = #2B4D89
lock_color_panel = #1D2A43
lock_color_hex = #F4F6FA
lock_color_text = #FFFFFF

; Per-hexagon fill colors for the lock-screen hex cluster.
; When blank, the left hex falls back to lock_color_primary and the
; top/bottom hexes fall back to lock_color_panel.
lock_color_hex_left =
lock_color_hex_top =
lock_color_hex_bottom =

; Background overlay color (any CSS color / rgba)
lock_color_overlay = rgba(0,0,0,0.50)

; Log-in button color
lock_color_submit = #c9222e

[updates]
; Enable/disable in-app update checks
enabled = true

; GitHub repository to monitor for new commits
github_repo = calebgruber/OneSign-Application

; Branch to monitor
branch = main

; Minutes between automatic update checks
check_interval_minutes = 30

; If true, install immediately after detecting a new commit
auto_install = false

; Optional direct installer URL override (leave blank to use latest release asset)
installer_url =

; Release asset filename used when installer_url is blank
installer_asset_name = OneSignAgentSetup.exe

; If true and running from a git checkout, updater will pull/build/restart from source
source_update_enabled = true
