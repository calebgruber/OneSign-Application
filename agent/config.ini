[server]
; URL of your PHP backend (no trailing slash)
url = http://YOUR_SERVER_IP_OR_HOSTNAME

; API key from the admin panel (Workstations → API Keys)
api_key = CHANGE_ME_TO_YOUR_API_KEY

[reader]
; Full path to the pcProx DLL
; Use pcProxAPI64.dll for 64-bit Windows, pcProxAPI.dll for 32-bit
dll_path = C:\Program Files\RF IDeas\pcProx\pcProxAPI64.dll

; How often to check for a card (milliseconds)
poll_interval_ms = 250

[behavior]
; Lock the workstation when the badge is removed from the reader
lock_on_remove = true

; How many seconds after badge removal to lock the screen
lock_delay_seconds = 5

; How often to send a heartbeat to the server (seconds)
heartbeat_interval = 30

; How long to wait before retrying a disconnected reader (seconds)
reconnect_delay_s = 10
