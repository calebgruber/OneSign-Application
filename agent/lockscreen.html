<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OneSign Lock Screen</title>
<style>
:root {
  --primary: #2B4D89;
  --panel: #1D2A43;
  --hex-left: #2B4D89;
  --hex-top: #1D2A43;
  --hex-bottom: #1D2A43;
  --overlay: rgba(0,0,0,0.5);
  --submit: #c9222e;
  --text: #fff;
  --hex-card: #F4F6FA;
}
* { box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  font-family: "Segoe UI", Inter, sans-serif;
  color: var(--text);
  background: #000;
  overflow: hidden;
}
#bg {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
#overlay { position: fixed; inset: 0; background: var(--overlay); }
.shell {
  position: fixed;
  inset: 0;
  display: grid;
  grid-template-columns: minmax(420px, 43vw) 1fr;
}
.left {
  background: linear-gradient(180deg, color-mix(in srgb, var(--primary) 92%, #000 8%), color-mix(in srgb, var(--primary) 75%, #000 25%));
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 22px;
  padding: clamp(24px, 4vh, 44px) clamp(20px, 2.8vw, 42px);
}
.right {
  background: color-mix(in srgb, var(--panel) 88%, #000 12%);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: clamp(20px, 3vh, 36px) clamp(20px, 2.8vw, 40px);
}
.logo-wrap { display: flex; justify-content: flex-end; }
#logo { max-height: 84px; max-width: 240px; width: auto; display: none; }
.hexes {
  display: grid;
  grid-template-columns: repeat(3, minmax(92px, 120px));
  gap: 12px;
}
.hex {
  clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
  min-height: 102px;
  padding: 12px 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 13px;
  font-weight: 600;
}
#hexLeft { background: var(--hex-left); }
#hexTop { background: var(--hex-top); }
#hexBottom { background: var(--hex-bottom); }
.form { width: min(430px, 96%); display: grid; gap: 10px; }
label { font-size: 12px; opacity: 0.86; text-transform: uppercase; letter-spacing: .06em; }
input {
  width: 100%;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.22);
  color: var(--text);
  border-radius: 6px;
  padding: 11px 12px;
  font-size: 14px;
}
input::placeholder { color: rgba(255,255,255,0.62); }
button {
  cursor: pointer;
  border: 0;
  border-radius: 6px;
  color: #fff;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: 11px 14px;
}
#submitBtn { background: var(--submit); }
#lockBtn { background: rgba(255,255,255,0.18); }
#statusAlert {
  min-height: 20px;
  font-size: 13px;
  color: #ffb3b3;
  visibility: hidden;
}
#statusAlert.show { visibility: visible; }
#helperText { font-size: 14px; opacity: .9; }
#station { font-size: 12px; opacity: .72; letter-spacing: .08em; }
#panelTitle { font-size: clamp(22px, 3vw, 34px); font-weight: 700; }
#panelMessage { white-space: pre-line; opacity: .9; max-width: 550px; }
.transition {
  position: fixed;
  inset: 0;
  background: rgba(3,7,18,.95);
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 18px;
  z-index: 100;
}
.transition.show { display: flex; }
.spinner {
  width: 42px;
  height: 42px;
  border: 3px solid rgba(255,255,255,.18);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<img id="bg" alt="">
<div id="overlay"></div>
<div class="shell">
  <section class="left">
    <div class="hexes" aria-hidden="true">
      <div id="hexLeft" class="hex">Tap Badge</div>
      <div id="hexTop" class="hex">OneSign</div>
      <div id="hexBottom" class="hex">Secure Log In</div>
    </div>
    <div class="form">
      <label for="usernameInput">Windows Username</label>
      <input id="usernameInput" type="text" autocomplete="username" placeholder="username">
      <label for="passwordInput">Windows Password</label>
      <input id="passwordInput" type="password" autocomplete="current-password" placeholder="password">
      <div id="statusAlert" role="alert"></div>
      <button id="submitBtn" type="button">Log In</button>
      <button id="lockBtn" type="button">Lock</button>
      <div id="helperText">Tap your badge or sign in with Windows credentials.</div>
      <div id="station"></div>
    </div>
  </section>
  <section class="right">
    <div class="logo-wrap"><img id="logo" alt="OneSign logo"></div>
    <div>
      <div id="panelTitle">OneSign</div>
      <div id="panelMessage">Welcome back.
Single Sign On is ready when you are.</div>
    </div>
  </section>
</div>

<div id="loginTransition" class="transition" aria-live="polite">
  <div class="spinner"></div>
  <div id="loginTransitionText">Authenticating user...</div>
</div>
<div id="lockTransition" class="transition" aria-live="polite">
  <div class="spinner"></div>
  <div id="lockTransitionText">Locking workstation...</div>
</div>

<script>
(() => {
  const state = {
    loginMessageTimer: null,
    lockMessageTimer: null,
    lockscreenReady: false,
  };

  const els = {
    bg: document.getElementById('bg'),
    overlay: document.getElementById('overlay'),
    logo: document.getElementById('logo'),
    station: document.getElementById('station'),
    helperText: document.getElementById('helperText'),
    panelTitle: document.getElementById('panelTitle'),
    panelMessage: document.getElementById('panelMessage'),
    statusAlert: document.getElementById('statusAlert'),
    usernameInput: document.getElementById('usernameInput'),
    passwordInput: document.getElementById('passwordInput'),
    submitBtn: document.getElementById('submitBtn'),
    lockBtn: document.getElementById('lockBtn'),
    hexLeft: document.getElementById('hexLeft'),
    hexTop: document.getElementById('hexTop'),
    hexBottom: document.getElementById('hexBottom'),
    loginTransition: document.getElementById('loginTransition'),
    lockTransition: document.getElementById('lockTransition'),
    loginTransitionText: document.getElementById('loginTransitionText'),
    lockTransitionText: document.getElementById('lockTransitionText'),
  };

  const isLive = location.hostname === '127.0.0.1' || location.hostname === 'localhost';

  const normalizeColor = (value, fallback) => {
    if (typeof value !== 'string' || !value.trim()) return fallback;
    return value.trim();
  };

  const showAlert = (msg = '') => {
    const text = (msg || '').trim();
    els.statusAlert.textContent = text;
    els.statusAlert.classList.toggle('show', !!text);
  };

  const clearTransitions = () => {
    clearTimeout(state.loginMessageTimer);
    clearTimeout(state.lockMessageTimer);
    els.loginTransition.classList.remove('show');
    els.lockTransition.classList.remove('show');
  };

  const updateTheme = (theme = {}) => {
    const primary = normalizeColor(theme.lock_color_primary, '#2B4D89');
    const panel = normalizeColor(theme.lock_color_panel, '#1D2A43');
    const text = normalizeColor(theme.lock_color_text, '#FFFFFF');
    const submit = normalizeColor(theme.lock_color_submit, '#c9222e');
    const overlay = normalizeColor(theme.lock_color_overlay, 'rgba(0,0,0,0.50)');
    const hexLeft = normalizeColor(theme.lock_color_hex_left, primary);
    const hexTop = normalizeColor(theme.lock_color_hex_top, panel);
    const hexBottom = normalizeColor(theme.lock_color_hex_bottom, panel);

    document.documentElement.style.setProperty('--primary', primary);
    document.documentElement.style.setProperty('--panel', panel);
    document.documentElement.style.setProperty('--text', text);
    document.documentElement.style.setProperty('--submit', submit);
    document.documentElement.style.setProperty('--overlay', overlay);
    document.documentElement.style.setProperty('--hex-left', hexLeft);
    document.documentElement.style.setProperty('--hex-top', hexTop);
    document.documentElement.style.setProperty('--hex-bottom', hexBottom);

    if (theme.lock_background_image) {
      els.bg.src = String(theme.lock_background_image);
      els.bg.style.display = '';
    } else {
      els.bg.removeAttribute('src');
      els.bg.style.display = 'none';
    }

    if (theme.lock_logo_image) {
      els.logo.src = String(theme.lock_logo_image);
      els.logo.style.display = 'block';
    } else {
      els.logo.removeAttribute('src');
      els.logo.style.display = 'none';
    }

    if (theme.lock_brand_name) {
      els.panelTitle.textContent = String(theme.lock_brand_name);
    }

    if (theme.lock_right_title) {
      els.panelTitle.textContent = String(theme.lock_right_title);
    }
    if (theme.lock_right_message) {
      els.panelMessage.textContent = String(theme.lock_right_message);
    }
  };

  const applyStatus = (payload = {}) => {
    const status = payload || {};
    const uiState = String(status.state || 'ready');
    els.station.textContent = status.workstation ? `WORKSTATION: ${status.workstation}` : '';
    els.helperText.textContent = String(status.helper || 'Tap your badge or sign in with Windows credentials.');
    if (status.title) els.panelTitle.textContent = String(status.title);
    if (status.panel_message) els.panelMessage.textContent = String(status.panel_message);

    if (status.default_username && !els.usernameInput.value) {
      els.usernameInput.value = String(status.default_username);
    }

    if (uiState === 'failed') {
      showAlert(String(status.message || 'Invalid username or password.'));
      clearTransitions();
      els.passwordInput.value = '';
      els.submitBtn.disabled = false;
      els.usernameInput.focus();
      return;
    }

    showAlert('');

    if (uiState === 'authenticating' || uiState === 'success') {
      clearTransitions();
      els.loginTransitionText.textContent = uiState === 'success'
        ? String(status.message || 'Logging in...')
        : 'Authenticating user...';
      els.loginTransition.classList.add('show');
      if (uiState === 'authenticating') {
        state.loginMessageTimer = setTimeout(() => {
          els.loginTransitionText.textContent = 'Loading workspace...';
        }, 900);
      }
      return;
    }

    if (uiState === 'locking') {
      clearTransitions();
      els.lockTransitionText.textContent = 'Locking workstation...';
      els.lockTransition.classList.add('show');
      state.lockMessageTimer = setTimeout(() => {
        els.lockTransitionText.textContent = 'Logging out...';
      }, 300);
      return;
    }

    clearTransitions();
    els.submitBtn.disabled = false;
  };

  const postJson = async (path, body) => {
    const resp = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {}),
      cache: 'no-store',
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) {
      const err = String(data.message || data.error || 'Request failed.');
      throw new Error(err);
    }
    return data;
  };

  const handleLogin = async () => {
    const username = els.usernameInput.value.trim();
    const password = els.passwordInput.value;
    if (!username || !password) {
      showAlert('Username and password are required.');
      return;
    }

    els.submitBtn.disabled = true;
    showAlert('');
    applyStatus({ state: 'authenticating' });

    if (!isLive) {
      setTimeout(() => applyStatus({ state: 'ready' }), 1200);
      els.submitBtn.disabled = false;
      return;
    }

    try {
      await postJson('/login', { username, password });
    } catch (err) {
      applyStatus({ state: 'failed', message: err?.message || 'Invalid username or password.' });
    }
  };

  const handleLock = async () => {
    applyStatus({ state: 'locking' });
    if (!isLive) {
      setTimeout(() => applyStatus({ state: 'ready' }), 1000);
      return;
    }
    try {
      await postJson('/lock', {});
    } catch (err) {
      applyStatus({ state: 'failed', message: err?.message || 'Could not lock workstation.' });
    }
  };

  const refresh = async () => {
    if (!isLive) return;
    try {
      const [themeResp, statusResp] = await Promise.all([
        fetch('/theme', { cache: 'no-store' }),
        fetch('/status', { cache: 'no-store' }),
      ]);
      if (themeResp.ok) updateTheme(await themeResp.json());
      if (statusResp.ok) applyStatus(await statusResp.json());
    } catch (_err) {
      // ignore polling errors in shell context
    }
  };

  els.submitBtn.addEventListener('click', handleLogin);
  els.lockBtn.addEventListener('click', handleLock);
  els.usernameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      els.passwordInput.focus();
    }
  });
  els.passwordInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      handleLogin();
    }
  });

  window.oneSignShell = { updateTheme, applyStatus };

  refresh();
  if (isLive) {
    setInterval(refresh, 1500);
  }
})();
</script>
</body>
</html>
